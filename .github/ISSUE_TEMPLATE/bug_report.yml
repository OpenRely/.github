name: "🪲 Bug Report"
description: "Report a bug, defect, or unexpected behavior"
title: "fix: "
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us diagnose and reproduce the problem.
        *(Feel free to submit this issue in English or Chinese.)*

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "e.g., When filtering models by provider, the drawer does not update..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the problem."
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "e.g., The drawer should show the updated model details without error."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Screen Recordings"
      description: "If applicable, add screenshots or recordings to help explain your problem."

  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "OS, browser version, runtime (Node.js/pnpm/browser), etc."
      placeholder: "e.g., macOS Sonoma, Chrome 124, Node.js 20.x"

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Any other context or logs about the problem."
